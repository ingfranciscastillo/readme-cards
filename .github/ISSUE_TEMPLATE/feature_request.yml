name: Feature request
description: Suggest an improvement to the editor, preview, export or GitHub import.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      placeholder: I make one card per repository and have to set the same colors every time.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      placeholder: Save a color preset and apply it to any template.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and this hasn't been suggested yet.
          required: true
